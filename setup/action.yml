name: 'Setup'
description: 'Setup runner'
inputs:
  checkout:
    description: 'Checkout repository'
    required: false
    default: 'true'
  persist-credentials:
    description: 'Persist the git credentials of the checkout, set it to false when the job does not push'
    required: false
    # TODO: default to 'false' in the next major
    default: 'true'
  node:
    description: 'Setup node and pnpm'
    required: false
    default: 'true'
  node-version:
    description: 'Override node version from .node-version file'
    required: false
    default: ''
  pnpm:
    description: 'Setup pnpm without node'
    required: false
    default: 'false'
  pnpm-cache:
    description: 'Paths to pnpm node_modules to cache'
    required: false
    default: 'node_modules'
  save-cache:
    description: 'Save cache when needed'
    required: false
    default: 'false'
  read-cache:
    description: 'Read cache when available'
    required: false
    default: 'true'
  apt-proxy:
    description: 'Setup apt proxy'
    required: false
    default: 'false'

runs:
  using: 'composite'

  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.checkout == 'true'
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        show-progress: false

    - shell: bash
      if: inputs.node == 'true' || inputs.pnpm == 'true'
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      # CACHE_KEY is read by later steps and callers; the only input in it is
      # the validated node version
      run: | # zizmor: ignore[github-env]
        if [[ ! "${NODE_VERSION}" =~ ^[0-9A-Za-z.+-]*$ ]]; then
          echo "::error::Invalid node-version input: ${NODE_VERSION}"
          exit 1
        fi
        os='${{ runner.os != 'Linux' && format('-{0}', runner.os) || '' }}'
        arch='${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}'
        if [ -n "${NODE_VERSION}" ]; then
          echo "CACHE_KEY=node_modules${os}${arch}-${NODE_VERSION}-${{
            hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml')
          }}" >> "$GITHUB_ENV"
        else
          echo "CACHE_KEY=node_modules${os}${arch}-${{
            hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml')
          }}" >> "$GITHUB_ENV"
        fi

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: (inputs.node == 'true' || inputs.pnpm == 'true') && inputs.read-cache == 'true' && runner.os != 'Windows'
      id: node-modules-restore
      with:
        path: ${{ inputs.pnpm-cache }}
        key: ${{ env.CACHE_KEY }}
        enableCrossOsArchive: true

    - shell: bash
      if: (inputs.node == 'true' || inputs.pnpm == 'true') && inputs.read-cache == 'true'
      env:
        CACHE_HIT: ${{ (steps.node-modules-restore.outputs.cache-hit == 'true') && 'true' || '' }}
      # CACHE_HIT is read by later steps and callers, it's only ever 'true' or empty
      run: echo "CACHE_HIT=${CACHE_HIT}" >> "$GITHUB_ENV" # zizmor: ignore[github-env]

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: inputs.node == 'true' || inputs.pnpm == 'true'
      with:
        cache: ${{ (env.CACHE_HIT != 'true' || runner.os == 'Windows') && inputs.read-cache == 'true' }}
        standalone: true

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.node == 'true'
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
        package-manager-cache: false

      # Ensure npm 11.5.1 or later for trusted publishing
      # https://docs.npmjs.com/trusted-publishers
    - shell: bash
      if: (inputs.node == 'true' || inputs.pnpm == 'true') && runner.os == 'Linux'
      run: |
        set -ex
        dpkg --compare-versions "$(npm -v)" lt 11.5.1 && (npm update -g npm; echo "updated npm to: $(npm -v)") || echo "npm is new enough: $(npm -v)"

    - if: (inputs.node == 'true' || inputs.pnpm == 'true') && (env.CACHE_HIT != 'true' || runner.os == 'Windows')
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        # Other environment variables
        HUSKY: '0' # By default do not run HUSKY install

    - if: (inputs.node == 'true' || inputs.pnpm == 'true') && inputs.save-cache == 'true' && env.CACHE_HIT != 'true' && runner.os != 'Windows'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.pnpm-cache }}
        key: ${{ env.CACHE_KEY }}
        enableCrossOsArchive: true

    - if: inputs.apt-proxy == 'true'
      shell: bash
      run: |
        echo "::group::Preparing squid-deb-proxy"
        set -e
        # drop the microsoft apt source of the runner images, we don't need it and
        # its outages fail the apt-get update
        sudo find /etc/apt/sources.list.d -type f -exec grep -q packages.microsoft.com {} \; -delete
        sudo apt-get -qq update
        sudo apt-get install -y squid-deb-proxy
        {
          echo "ppa.launchpad.net"
          echo "ppa.launchpadcontent.net"
        } | sudo tee -a /etc/squid-deb-proxy/mirror-dstdomain.acl.d/containerbase.acl
        # newer squid-deb-proxy versions (ubuntu 26.04) listen on 3563, the
        # consumers use 8000
        sudo sed -i -E 's/^http_port [0-9]+/http_port 8000/' /etc/squid-deb-proxy/squid-deb-proxy.conf
        sudo systemctl restart squid-deb-proxy
        timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/8000) 2> /dev/null; do sleep 1; done'
        echo "::endgroup::"
